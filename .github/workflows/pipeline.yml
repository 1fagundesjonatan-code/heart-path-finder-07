name: Pipeline

# Fluxo:
#
#   quality ──┬── summary  (comentario sticky no PR)
#             └── deploy   (so push na main → Vercel)
#
# quality roda em todo PR (typecheck, lint, test, build).
# deploy so dispara no push da main, depois do quality verde.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ──────────────────────── qualidade ────────────────────────
  # So em PR (e dispatch manual). No push da main confia-se no gate do PR e
  # vai direto pro deploy - sem rodar os mesmos checks duas vezes.
  quality:
    name: Quality gates
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint
      - name: Test
        if: ${{ !cancelled() }}
        run: pnpm test
      - name: Build
        if: ${{ !cancelled() }}
        run: pnpm build

  # ──────────────── resumo (comentario no PR) ────────────────
  summary:
    name: PR summary comment
    needs: quality
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const r = ${{ toJSON(needs.quality.result) }};
            const ic = ({ success: '✅', failure: '❌', cancelled: '⚪' }[r] || '⏳');
            const ok = r === 'success';
            const marker = '<!-- pipeline-summary -->';
            const body = [
              marker,
              `### ${ok ? '✅ Pipeline verde' : '⚠️ Pipeline com pendências'} - \`${context.sha.substring(0, 7)}\``,
              '',
              '| Etapa | Resultado |',
              '|-------|-----------|',
              `| Quality gates (typecheck, lint, test, build) | ${ic} \`${r}\` |`,
              '',
              '<sub>🤖 Comentário único, atualizado a cada run do pipeline.</sub>',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const list = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const found = list.data.find((c) => c.body && c.body.includes(marker));
            if (found) await github.rest.issues.updateComment({ owner, repo, comment_id: found.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  # ──────────────────────── deploy (prod) ────────────────────────
  deploy:
    name: Deploy (production)
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      PROJECT_NAME: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: rm -rf .git
      - name: Validate secrets
        run: |
          [ -n "$VERCEL_TOKEN" ] || { echo "❌ VERCEL_TOKEN ausente"; exit 1; }
          [ -n "$VERCEL_ORG_ID" ] || { echo "❌ VERCEL_ORG_ID ausente"; exit 1; }
      - run: npm install -g vercel@latest
      - name: Link project
        run: |
          vercel link --yes --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" --project="$PROJECT_NAME"
          echo "VERCEL_PROJECT_ID=$(node -p "require('./.vercel/project.json').projectId")" >> $GITHUB_ENV
          echo "VERCEL_ORG_ID=$(node -p "require('./.vercel/project.json').orgId")" >> $GITHUB_ENV
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" --force)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo "## 🚀 Deploy de produção"
            echo "| Status | URL | Commit |"
            echo "|---|---|---|"
            echo "| \`${{ job.status }}\` | $URL | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
